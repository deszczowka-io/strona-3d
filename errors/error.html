<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Błąd · Analizator Deszczówki</title>
    <style>
        :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #17221e; background: #f4f7f5; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
        main { width: min(100%, 560px); padding: clamp(28px, 7vw, 56px); background: #fff; border: 1px solid #dfe8e2; border-radius: 24px; box-shadow: 0 24px 70px #18372812; }
        .brand { color: #466653; font-size: 14px; font-weight: 700; letter-spacing: .02em; }
        .code { margin: 44px 0 8px; color: #8aa194; font-size: 14px; font-weight: 700; letter-spacing: .14em; }
        h1 { margin: 0; font-size: clamp(30px, 7vw, 44px); letter-spacing: -.04em; line-height: 1.1; }
        p { margin: 16px 0 30px; color: #64736a; font-size: 16px; line-height: 1.6; }
        a { display: inline-flex; min-height: 46px; align-items: center; justify-content: center; padding: 0 20px; border-radius: 12px; background: #285c43; color: white; font-size: 14px; font-weight: 650; text-decoration: none; }
        a:hover { background: #1e4935; }
        a:focus-visible { outline: 3px solid #d4a844; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <div class="brand">Analizator Deszczówki</div>
        <div class="code">BŁĄD 404</div>
        <h1>Strona nieznaleziona</h1>
        <p>Szukana strona nie istnieje lub została przeniesiona.</p>
        <a href="/">Wróć na stronę główną</a>
    </main>
</body>
</html>
